# Workflow for building and deploying a Hugo site to GitHub Pages
name: Build and Deploy Sphinx site for support Salt ref docs to pages

on:
  push:
    branches:
      - '*'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
#concurrency:
#  group: "pages"
#  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # master HTML
  master-html:
    runs-on: ubuntu-latest
    container: ghcr.io/saltstack/salt-ci-containers/builddocs:latest
    env:
      DOC_BRANCH: master
      WEBSITE_POINT_RELEASE: master
      WEBSITE_RELEASE: master
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'
      - name: Checkout and prep Salt
        run: |
          git clone --depth 1 -b "${DOC_BRANCH}" https://github.com/saltstack/salt
          sed -i "s:^contextvars==.*::g" salt/requirements/static/pkg/py3.10/linux.txt
          sed -i "s:^immutables==.*::g" salt/requirements/static/pkg/py3.10/linux.txt
          sed -i "s:^rpm-vercmp==.*::g" salt/requirements/static/pkg/py3.10/linux.txt
      - name: Install Python prereqs
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install -U pip setuptools wheel
          pip install -r salt/requirements/static/ci/py3.10/docs.txt && pip install -r salt/requirements/static/pkg/py3.10/linux.txt
          pip install jaraco.text==3.14.0
      - name: Build docs
        run: |
          source venv/bin/activate
          ./build_html.sh
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public


