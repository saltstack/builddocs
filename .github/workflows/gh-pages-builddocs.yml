  single-tarball-site-archive:
    runs-on: ubuntu-latest
    needs:
      - master-html
      - master-pdf
      - latest-html
      - latest-pdf
      - latest-3007-html
      - previous-3006-html
      - previous-3006-pdf
    if: success()
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
      - name: Download salt-install-guide and salt-user-guide
        run: |
          # TODO
          # - Download salt-install-guide
          # - Download salt-user-guide
          curl -o salt.sources -L https://github.com/saltstack/salt-install-guide/releases/download/latest/salt.sources
      - name: Display all downloaded archives/artifacts
        run: |
          ls -lah

          echo "
          Listing *html/*..."
          ls -lah *html/*

          echo "
          Listing *pdf/*..."
          ls -lah *pdf/*
      - name: Create and populate docs-saltproject-io directory structure
        run: |
          echo "
          Creating docs-saltproject-io directory structure..."
          mkdir -p docs-saltproject-io/en
          mkdir -p docs-saltproject-io/salt/install-guide/en/latest
          mkdir -p docs-saltproject-io/salt/user-guide/en/latest
          mkdir -p docs-saltproject-io/pdf
          echo '<meta http-equiv="refresh" content="0; url=en/latest/" />' > docs-saltproject-io/index.html
          echo '<meta http-equiv="refresh" content="0; url=latest/" />' > docs-saltproject-io/en/index.html
          echo '<meta http-equiv="refresh" content="0; url=en/latest/" />' > docs-saltproject-io/salt/install-guide/index.html
          echo '<meta http-equiv="refresh" content="0; url=latest/" />' > docs-saltproject-io/salt/install-guide/en/index.html
          echo '<meta http-equiv="refresh" content="0; url=en/latest/" />' > docs-saltproject-io/salt/user-guide/index.html
          echo '<meta http-equiv="refresh" content="0; url=latest/" />' > docs-saltproject-io/salt/user-guide/en/index.html

          echo "
          Moving built docs to expected docs file paths..."
          mv *-html/* docs-saltproject-io/en/
          mv *-pdf/pdf/* docs-saltproject-io/pdf/
      - name: Create tarball of docs
        run: |
          tar cvzf docs-saltproject-io.tar.gz docs-saltproject-io
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          path: docs-saltproject-io.tar.gz
          if-no-files-found: error
          retention-days: 1

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs:
      - single-tarball-site-archive
    if: success() && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
