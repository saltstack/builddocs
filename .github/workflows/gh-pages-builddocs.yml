# Workflow for building and deploying a Hugo site to GitHub Pages
name: Build and Deploy Sphinx site for support Salt ref docs to pages

on:
  push:
    branches:
      - '*'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # master HTML
  master-html:
    runs-on: ghcr.io/saltstack/builddocs:docker-container
    env:
      DOC_BRANCH: master
      WEBSITE_POINT_RELEASE: master
      WEBSITE_RELEASE: master
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build docs
        run: |
          ./build_html.sh
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
    
  # master PDF
  master-pdf:
    runs-on: ghcr.io/saltstack/builddocs:docker-container
    env:
      DOC_BRANCH: master
      WEBSITE_POINT_RELEASE: master
      WEBSITE_RELEASE: master
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build docs
        run: |
          ./build_pdf.sh
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # latest HTML
  latest-html:
    runs-on: ghcr.io/saltstack/builddocs:docker-container
    env:
      BUILD_TYPE: latest
      DOC_BRANCH: 'v3007.1'
      WEBSITE_POINT_RELEASE: '3007.1'
      WEBSITE_RELEASE: latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build docs
        run: |
          ./build_html.sh
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
    
  # lastest PDF
  latest-pdf:
    runs-on: ghcr.io/saltstack/builddocs:docker-container
    env:
      BUILD_TYPE: latest
      DOC_BRANCH: 'v3007.1'
      WEBSITE_POINT_RELEASE: '3007.1'
      WEBSITE_RELEASE: latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build docs
        run: |
          ./build_pdf.sh
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # latest-3007 HTML
  latest-3007-html:
    runs-on: ghcr.io/saltstack/builddocs:docker-container
    env:
      BUILD_TYPE: latest
      DOC_BRANCH: 'v3007.1'
      WEBSITE_POINT_RELEASE: '3007.1'
      WEBSITE_RELEASE: '3007.1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build docs
        run: |
          ./build_html.sh
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # previous-3006 html
  previous-3006-html:
    runs-on: ghcr.io/saltstack/builddocs:docker-container
    env:
      BUILD_TYPE: previous
      DOC_BRANCH: 'v3006.9'
      WEBSITE_POINT_RELEASE: '3006.9'
      WEBSITE_RELEASE: '3006'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build docs
        run: |
          ./build_html.sh
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # previous-3006 PDF
  previous-3006-pdf:
    runs-on: ghcr.io/saltstack/builddocs:docker-container
    env:
      BUILD_TYPE: previous
      DOC_BRANCH: 'v3006.9'
      WEBSITE_POINT_RELEASE: '3006.9'
      WEBSITE_RELEASE: '3006'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build docs
        run: |
          ./build_pdf.sh
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs:
      - master-html
      - master-pdf
      - latest-html
      - latest-pdf
      - latest-3007-html
      - previous-3006-html
      - previous-3006-pdf
    if: success() && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4