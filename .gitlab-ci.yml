pages:
  stage: pages
  image: alpine
  script:
    - echo '<meta http-equiv="refresh" content="0; url=contents.html" />' > ./public/latest/index.html
    - find public -maxdepth 3
    - 'echo "Gitlab Pages available at: ${CI_PAGES_URL}"'
  artifacts:
    paths:
      - public/

publish-docs:
  stage: trigger-upload
  variables:
    CICD_S3_DEST_PATH: "docs.saltproject.io/en/"
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PROJECT_PATH == $CICD_UPSTREAM_PATH'
