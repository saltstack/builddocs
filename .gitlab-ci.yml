---
stages:
  - pre-commit
  - docker-images
  - build-docs
  - pages
  - trigger-upload

default:
  before_script:
    - 'chmod -R g-w,o-w . && umask 0022'

include:
  - project: 'saltstack/pop/cicd/ci-templates'
    file: '/lint/pre-commit-run-all-py38.yml'
  - project: 'saltstack/pop/cicd/ci-templates'
    file: '/docker/kaniko-single.yml'
  - project: saltstack/pop/cicd/ci-templates
    file: /docswork/salt-publish-docs-release.yml

variables:
  CICD_UPSTREAM_PATH: "saltstack/open/docs/builddocs"

.dockertags: &dockertags
  tags:
  - docker

docker-image:
  <<: *dockertags
  stage: docker-images
  extends: .kaniko-build
  variables:
    CONTAINER_NAME: builddocs
    CONTAINER_TAG: '3.10.9'
    CONTEXT_PATH: '/'
    DOCKERFILE_PATH: 'container/Dockerfile'
  only:
    changes:
      - container/*
      - .gitlab-ci.yml
  except:
    - schedules

master-html:
  stage: build-docs
  image: ${CI_REGISTRY_IMAGE}/builddocs:3.10.9
  variables:
    DOC_BRANCH: master
    WEBSITE_POINT_RELEASE: master
    WEBSITE_RELEASE: master
  script:
    - ./build_html.sh
  cache:
    key: venv-${DOC_BRANCH}
    paths:
      - venv/
  artifacts:
    paths:
      - public/
    expire_in: 7 days

