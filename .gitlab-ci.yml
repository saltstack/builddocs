---
stages:
  - docker-images
  - build-docs
  - pages

default:
  before_script:
    - 'chmod -R g-w,o-w . && umask 0022'

include:
  - project: 'saltstack/pop/cicd/ci-templates'
    file: '/docker/kaniko-single.yml'

.dockertags: &dockertags
  tags:
  - docker

docker-image:
  <<: *dockertags
  stage: docker-images
  extends: .kaniko-build
  variables:
    CONTAINER_NAME: builddocs
    CONTAINER_TAG: '3.7.6'
    CONTEXT_PATH: '/'
    DOCKERFILE_PATH: 'container/Dockerfile'
  only:
    changes:
      - container/*
      - .gitlab-ci.yml
  except:
    - schedules

master-html:
  stage: build-docs
  image: ${CI_REGISTRY_IMAGE}/builddocs:3.7.6
  variables:
    DOC_BRANCH: master
    WEBSITE_POINT_RELEASE: master
    WEBSITE_RELEASE: master
  script:
    - ./build_html.sh
    - if [ "${CI_COMMIT_REF_PROTECTED}" == "true" ]; then ./publish_html.sh; fi
  cache:
    paths:
      - venv/
  artifacts:
    paths:
      - public/
    expire_in: 7 days

